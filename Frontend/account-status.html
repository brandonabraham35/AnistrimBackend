<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Status | AniStrim</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-native.css">
</head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo">
    <div class="auth-logo-icon">A</div>
    <h1>Ani<span>Strim</span></h1>
    <p id="status-title">Account Status</p>
  </div>

  <div style="text-align:center;padding:20px 0;">
    <div id="status-icon" style="font-size:3rem;margin-bottom:12px;">⚠️</div>
    <h2 id="status-heading" style="color:#fbbf24;font-size:1.2rem;margin-bottom:8px;">Account Not Active</h2>
    <p id="status-message" style="color:var(--text-dim,#9ca3af);font-size:0.9rem;line-height:1.6;margin-bottom:20px;">
      Your account is currently not active. Please contact support if you believe this is a mistake.
    </p>
    <a href="login.html" class="auth-submit" style="text-decoration:none;display:inline-block;text-align:center;">Back to Sign In</a>
  </div>
</div>

<script src="config.js"></script>
<script src="scrpt.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script src="js/navigation.js"></script>
<script>
// ── Read the status from the query string and show the right message ──
const qs = new URLSearchParams(location.search);
const status = qs.get('status') || 'unknown';

const messages = {
  suspended: {
    icon: '🚫',
    heading: 'Account Suspended',
    message: 'Your account has been suspended. If you believe this is a mistake, please contact support.'
  },
  deactivated: {
    icon: '💤',
    heading: 'Account Deactivated',
    message: 'Your account has been deactivated. You can reactivate it by signing in again.'
  },
  deleted: {
    icon: '🗑️',
    heading: 'Account Deleted',
    message: 'This account has been deleted. If you would like to create a new account, please sign up.'
  },
  pending: {
    icon: '⏳',
    heading: 'Verification Required',
    message: 'Your account is pending email verification. Please check your inbox for the verification code.'
  }
};

const info = messages[status] || messages.unknown || {
  icon: '⚠️',
  heading: 'Account Not Active',
  message: 'Your account is currently not active. Please contact support if you believe this is a mistake.'
};

document.getElementById('status-icon').textContent = info.icon;
document.getElementById('status-heading').textContent = info.heading;
document.getElementById('status-message').textContent = info.message;
</script>
</body>
</html>
