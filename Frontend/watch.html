<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch | AniStrim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/watch.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div id="player-container">
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="player-overlay">
            <div class="spinner"></div>
            <div class="loading-info">
                <h2 id="loading-anime-title"></h2>
                <p id="loading-episode-info"></p>
                <span>Loading stream...</span>
            </div>
        </div>

        <!-- Error Overlay -->
        <div id="error-overlay" class="player-overlay" style="display: none;">
            <div class="error-icon">⚠️</div>
            <h2 id="error-title">Unable to Play Episode</h2>
            <p id="error-message"></p>
            <div class="error-actions">
                <button id="retry-btn" class="player-btn">Retry</button>
                <button id="change-source-btn" class="player-btn">Change Source</button>
                <button id="prev-ep-btn-error" class="player-btn">Previous Episode</button>
                <button id="next-ep-btn-error" class="player-btn">Next Episode</button>
            </div>
        </div>

        <!-- Main Player Wrapper -->
        <div id="player-wrap" class="paused">
            <video id="animePlayer" playsinline></video>

            <!-- Center Play/Pause Indicator -->
            <div class="center-indicator" id="center-indicator"></div>

            <!-- Top Controls Overlay -->
            <div class="controls-overlay top">
                <button id="back-btn" class="player-btn icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <div class="episode-title-info">
                    <h1 id="watch-anime-title"></h1>
                    <p id="watch-ep-title"></p>
                </div>
                <div style="flex-grow: 1;"></div>
                <button id="skip-intro-btn" class="player-btn skip-btn" style="display: none;">Skip Intro</button>
            </div>

            <!-- Bottom Controls Overlay -->
            <div class="controls-overlay bottom">
                <div class="progress-bar-container">
                    <input type="range" id="progress-bar" class="progress-bar" min="0" max="100" step="0.1" value="0">
                </div>
                <div class="bottom-controls-main">
                    <div class="controls-left">
                        <button id="play-pause-btn" class="player-btn icon-btn">
                            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button id="seek-backward-btn" class="player-btn icon-btn">
                            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                        </button>
                        <button id="seek-forward-btn" class="player-btn icon-btn">
                            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                        </button>
                        <div class="volume-container">
                            <button id="volume-btn" class="player-btn icon-btn">
                                <svg id="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
                            </button>
                            <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                        </div>
                        <div id="time-display" class="time-display">0:00 / 0:00</div>
                    </div>
                    <div class="controls-right">
                        <button id="next-ep-btn" class="player-btn icon-btn" title="Next Episode">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                        <button id="episodes-btn" class="player-btn icon-btn" title="Episodes">
                            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                        </button>
                        <button id="settings-btn" class="player-btn icon-btn" title="Settings">
                            <svg viewBox="0 0 24 24"><path d="M19.4 12.3c.2-.4.2-.9 0-1.3l-1.9-3.3c-.2-.4-.6-.6-1-.6h-3.8c-.4 0-.8.2-1 .6L10 11c-.2.4-.2.9 0 1.3l1.8 3.2c.2.4.6.6 1 .6h3.8c.4 0 .8-.2 1-.6l1.8-3.2zM12 15c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/></svg>
                        </button>
                        <button id="fullscreen-btn" class="player-btn icon-btn" title="Fullscreen">
                            <svg id="fullscreen-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Settings Menu -->
            <div id="settings-menu" class="settings-menu">
                <div class="settings-panel" data-panel="main">
                    <button class="settings-item" data-opens="quality"><span>Quality</span><span class="setting-value" id="quality-value">Auto</span></button>
                    <button class="settings-item" data-opens="speed"><span>Playback Speed</span><span class="setting-value" id="speed-value">Normal</span></button>
                </div>
                <div class="settings-panel" data-panel="quality" id="quality-panel">
                    <!-- Quality options will be populated by JS -->
                </div>
                <div class="settings-panel" data-panel="speed" id="speed-panel">
                    <!-- Playback speed options will be populated by JS -->
                        </button>
                    </div>
                </div>
            </div>

            <!-- Next Episode Overlay -->
            <div id="next-episode-overlay" class="player-overlay next-ep">
                <span>Next Episode</span>
                <h3 id="next-ep-title-overlay"></h3>
                <div class="next-ep-actions">
                    <button id="play-next-btn" class="player-btn">Play Now</button>
                    <button id="cancel-next-btn" class="player-btn icon-btn" title="Cancel">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
                <div id="next-ep-countdown"></div>
            </div>
        </div>

        <!-- Episode Sidebar -->
        <div id="episode-sidebar" class="player-sidebar">
            <div class="sidebar-header">
                <h3>Episodes</h3>
                <button id="close-sidebar-btn" class="player-btn icon-btn">&times;</button>
            </div>
            <div id="sidebar-episode-list"></div>
        </div>
    </div>

    <script src="js/scrpt.js"></script>
    <script src="js/watch.js"></script>
</body>
</html>
