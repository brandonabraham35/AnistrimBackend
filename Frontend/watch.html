<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Watch | AniStrim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/watch.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div id="player-container">
        <!-- Loading Overlay -->
        <div id="loading-overlay" class="player-overlay">
            <div class="spinner"></div>
            <div class="loading-info">
                <h2 id="loading-anime-title"></h2>
                <p id="loading-episode-info"></p>
                <span id="loading-status">Preparing player...</span>
            </div>
        </div>

        <!-- Error Overlay -->
        <div id="error-overlay" class="player-overlay" style="display: none;">
            <div class="error-icon">⚠️</div>
            <h2 id="error-title">Unable to Play Episode</h2>
            <p id="error-message"></p>
            <div class="error-actions">
                <button id="retry-btn" class="player-btn">Retry</button>
                <button id="change-source-btn" class="player-btn">Change Server</button>
                <button id="reload-btn" class="player-btn">Reload</button>
                <button id="prev-ep-btn-error" class="player-btn">Previous Episode</button>
                <button id="next-ep-btn-error" class="player-btn">Next Episode</button>
            </div>
        </div>

        <!-- Resume Prompt Overlay (near-end continue) -->
        <div id="resume-overlay" class="player-overlay resume-prompt">
            <div class="resume-card">
                <h3>Continue Watching?</h3>
                <p class="resume-progress-text">
                    <span id="resume-progress-pct">50%</span> of this episode
                    <span id="resume-saved-time"></span>
                    has already been watched.
                </p>
                <div class="resume-actions">
                    <button id="resume-continue-btn" class="player-btn">Continue Watching</button>
                    <button id="resume-restart-btn" class="player-btn">Restart from Beginning</button>
                </div>
            </div>
        </div>

        <!-- Main Player Wrapper -->
        <div id="player-wrap" class="paused">
            <video id="animePlayer" playsinline preload="metadata"></video>

            <!-- Center Action Indicator (play/pause/seek flash) -->
            <div class="center-indicator" id="center-indicator">
                <div class="center-indicator-icon">
                    <svg id="center-indicator-svg" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <span id="center-indicator-label"></span>
                </div>
            </div>

            <!-- Buffering Spinner (small, over video) -->
            <div class="buffering-spinner" id="buffering-spinner">
                <div class="spinner small"></div>
            </div>

            <!-- Top Controls Overlay -->
            <div class="controls-overlay top" id="top-controls">
                <button id="back-btn" class="player-btn icon-btn" title="Back">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <div class="episode-title-info">
                    <h1 id="watch-anime-title"></h1>
                    <p id="watch-ep-title"></p>
                </div>
                <div style="flex-grow: 1;"></div>
                <button id="skip-intro-btn" class="player-btn skip-btn" style="display: none;">Skip Intro</button>
                <button id="skip-outro-btn" class="player-btn skip-btn" style="display: none; margin-left: 0.5rem;">Skip Outro</button>
            </div>

            <!-- Bottom Controls Overlay -->
            <div class="controls-overlay bottom" id="bottom-controls">
                <!-- Progress Bar -->
                <div class="progress-bar-container" id="progress-bar-container">
                    <div class="progress-track" id="progress-track">
                        <div class="progress-buffer" id="progress-buffer"></div>
                        <div class="progress-played" id="progress-played"></div>
                        <div class="progress-thumb" id="progress-thumb"></div>
                        <div class="progress-hover" id="progress-hover"></div>
                        <div class="progress-tooltip" id="progress-tooltip">
                            <span id="progress-tooltip-time">0:00</span>
                        </div>
                    </div>
                </div>

                <div class="bottom-controls-main">
                    <div class="controls-left">
                        <button id="play-pause-btn" class="player-btn icon-btn large" title="Play/Pause (Space)">
                            <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </button>
                        <button id="prev-ep-btn" class="player-btn icon-btn" title="Previous Episode (Shift + ←)">
                            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                        </button>
                        <button id="seek-backward-btn" class="player-btn icon-btn" title="Back 10s (←)">
                            <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
                        </button>
                        <button id="seek-forward-btn" class="player-btn icon-btn" title="Forward 10s (→)">
                            <svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
                        </button>
                        <button id="next-ep-btn" class="player-btn icon-btn" title="Next Episode (Shift + →)">
                            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                        </button>
                        <div class="volume-container">
                            <button id="volume-btn" class="player-btn icon-btn" title="Mute (M)">
                                <svg id="volume-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>
                            </button>
                            <div class="volume-slider-wrap">
                                <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.05" value="1">
                            </div>
                        </div>
                        <div id="time-display" class="time-display">
                            <span id="current-time">0:00</span>
                            <span class="time-sep">/</span>
                            <span id="duration-time">0:00</span>
                            <span class="time-remaining" id="remaining-time">-0:00</span>
                        </div>
                    </div>
                    <div class="controls-right">
                        <button id="episodes-btn" class="player-btn icon-btn" title="Episodes (E)">
                            <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                        </button>
                        <button id="settings-btn" class="player-btn icon-btn" title="Settings (S)">
                            <svg viewBox="0 0 24 24"><path d="M19.4 12.3c.2-.4.2-.9 0-1.3l-1.9-3.3c-.2-.4-.6-.6-1-.6h-3.8c-.4 0-.8.2-1 .6L10 11c-.2.4-.2.9 0 1.3l1.8 3.2c.2.4.6.6 1 .6h3.8c.4 0 .8-.2 1-.6l1.8-3.2zM12 15c-1.7 0-3-1.3-3-3s1.3-3 3-3 3 1.3 3 3-1.3 3-3 3z"/></svg>
                        </button>
                        <button id="pip-btn" class="player-btn icon-btn" title="Picture-in-Picture (P)" style="display:none;">
                            <svg viewBox="0 0 24 24"><path d="M19 7H9c-1.1 0-2 .9-2 2v6c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm0 8H9V9h10v6zM3 5h8v2H5v10h6v2H3c-1.1 0-2-.9-2-2V7c0-1.1.9-2 2-2z"/></svg>
                        </button>
                        <button id="fullscreen-btn" class="player-btn icon-btn" title="Fullscreen (F)">
                            <svg id="fullscreen-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Settings Menu -->
            <div id="settings-menu" class="settings-menu">
                <div class="settings-panel" data-panel="main">
                    <button class="settings-item" data-opens="quality">
                        <span class="settings-item-label">Quality</span>
                        <span class="setting-value" id="quality-value">Auto</span>
                    </button>
                    <button class="settings-item" data-opens="speed">
                        <span class="settings-item-label">Playback Speed</span>
                        <span class="setting-value" id="speed-value">Normal</span>
                    </button>
                    <button class="settings-item" data-opens="subtitle">
                        <span class="settings-item-label">Subtitles</span>
                        <span class="setting-value" id="subtitle-value">Off</span>
                    </button>
                    <button class="settings-item" data-opens="audio" id="audio-settings-item" style="display:none;">
                        <span class="settings-item-label">Audio Track</span>
                        <span class="setting-value" id="audio-value">Default</span>
                    </button>
                    <button class="settings-item" data-opens="autoplay">
                        <span class="settings-item-label">Autoplay & Countdown</span>
                        <span class="setting-value" id="autoplay-summary">On · 10s</span>
                    </button>
                </div>
                <div class="settings-panel" data-panel="quality" id="quality-panel" hidden>
                    <button class="settings-item settings-back" data-back>&larr; Quality</button>
                    <div id="quality-options"></div>
                </div>
                <div class="settings-panel" data-panel="speed" id="speed-panel" hidden>
                    <button class="settings-item settings-back" data-back>&larr; Playback Speed</button>
                    <div id="speed-options"></div>
                </div>
                <div class="settings-panel" data-panel="subtitle" id="subtitle-panel" hidden>
                    <button class="settings-item settings-back" data-back>&larr; Subtitles</button>
                    <div id="subtitle-options"></div>
                </div>
                <div class="settings-panel" data-panel="audio" id="audio-panel" hidden>
                    <button class="settings-item settings-back" data-back>&larr; Audio Track</button>
                    <div id="audio-options"></div>
                </div>
                <div class="settings-panel" data-panel="autoplay" id="autoplay-panel" hidden>
                    <button class="settings-item settings-back" data-back>&larr; Autoplay & Countdown</button>
                    <button class="settings-item" id="autoplay-toggle-btn">
                        <span class="settings-item-label">Autoplay Next Episode</span>
                        <span class="setting-value" id="autoplay-value">On</span>
                    </button>
                    <button class="settings-item" id="countdown-config-btn">
                        <span class="settings-item-label">Autoplay Countdown</span>
                        <span class="setting-value" id="countdown-value">10s</span>
                    </button>
                    <div id="countdown-presets" style="display:none;">
                        <button class="settings-item" data-countdown="5">5 seconds</button>
                        <button class="settings-item" data-countdown="10">10 seconds</button>
                        <button class="settings-item" data-countdown="15">15 seconds</button>
                        <button class="settings-item" data-countdown="30">30 seconds</button>
                    </div>
                </div>
            </div>

            <!-- End-of-Episode Overlay -->
            <div id="next-episode-overlay" class="player-overlay next-ep">
                <div class="next-ep-header">
                    <span class="next-ep-label">Next Episode</span>
                    <span class="next-ep-countdown-badge" id="next-ep-countdown-badge">10</span>
                </div>
                <h3 id="next-ep-title-overlay"></h3>
                <div class="next-ep-meta">
                    <span id="next-ep-time-meta"></span>
                </div>
                <div class="next-ep-actions">
                    <button id="play-next-btn" class="player-btn next-ep-primary">Next Episode</button>
                    <button id="replay-btn" class="player-btn">
                        <span style="display:flex;align-items:center;gap:6px;">↺ Replay</span>
                    </button>
                    <button id="episode-list-btn" class="player-btn">
                        <span style="display:flex;align-items:center;gap:6px;">☰ Episode List</span>
                    </button>
                    <button id="exit-player-btn" class="player-btn">
                        <span style="display:flex;align-items:center;gap:6px;">✕ Exit Player</span>
                    </button>
                </div>
                <div class="next-ep-cancel-hint">
                    <button id="cancel-next-btn" class="player-btn icon-btn" title="Cancel autoplay">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Episode Sidebar / Drawer -->
        <div id="episode-sidebar" class="player-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-group">
                    <h3 id="sidebar-anime-title"></h3>
                    <div class="sidebar-season-info">
                        <span id="sidebar-season-label">Season 1</span>
                        <span id="sidebar-ep-count"></span>
                    </div>
                </div>
                <button id="close-sidebar-btn" class="player-btn icon-btn" title="Close">&times;</button>
            </div>

            <!-- Season Navigation -->
            <div id="season-nav" class="season-nav">
                <!-- Season buttons rendered dynamically; hidden when single season -->
            </div>

            <!-- Episode List -->
            <div id="sidebar-episode-list" class="sidebar-episode-list"></div>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="scrpt.js"></script>
    <script src="watch.js"></script>
</body>
</html>
