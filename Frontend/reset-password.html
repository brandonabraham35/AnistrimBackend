<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AniStrim</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-native.css">
</head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo">
    <div class="auth-logo-icon">A</div>
    <h1>New Password</h1>
    <p>Choose a strong password</p>
  </div>

  <!-- Error message container -->
  <p id="auth-error" style="display:none;"></p>

  <div class="input-group">
    <label>New Password</label>
    <div class="password-wrapper">
      <input type="password" id="new-pass" placeholder="••••••••">
      <button class="toggle-pw" onclick="togglePasswordVisibility('new-pass')">👁️</button>
    </div>
  </div>
  <div class="input-group">
    <label>Confirm Password</label>
    <input type="password" id="confirm-pass" placeholder="••••••••">
  </div>
  <button class="auth-submit" onclick="handleReset()">Reset Password</button>
  <div class="auth-links"><a href="login.html">← Back to Sign In</a></div>
</div>

<script src="shared/client-contract/session.js"></script>
<script src="config.js"></script>
<script src="scrpt.js"></script>
<script src="js/api.js"></script>
<script>
async function handleReset() {
  const token    = new URLSearchParams(window.location.search).get('token');
  const newPass  = document.getElementById('new-pass').value;
  const confirm  = document.getElementById('confirm-pass').value;

  if (!token)            { showError('Invalid reset link.'); return; }
  if (newPass.length < 6){ showError('Password must be at least 6 characters.'); return; }
  if (newPass !== confirm){ showError('Passwords do not match.'); return; }

  const btn = document.querySelector('.auth-submit');
  btn.textContent = 'Resetting...'; btn.disabled = true;

  try {
    // Use the canonical apiFetch so the envelope is handled consistently
    // and errors are handled gracefully (timeout, network, invalid token).
    const { ok, data } = await window.apiFetch('/api/auth/reset-password', {
      method: 'POST',
      body: JSON.stringify({ token, newPassword: newPass })
    });

    if (ok) {
      showToast('✅ ' + (data && data.message || 'Password reset successfully.'));
      setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } else {
      showError((data && data.message) || 'Reset failed.');
      btn.textContent = 'Reset Password'; btn.disabled = false;
    }
  } catch (e) {
    const msg = (e && e.message) || '';
    let friendly = 'Reset failed. Please try again.';
    if (/expired/i.test(msg)) friendly = 'This reset link has expired. Please request a new one.';
    else if (/invalid/i.test(msg)) friendly = 'Invalid reset link. Please check the URL and try again.';
    else if (/connection|server/i.test(msg)) friendly = 'Cannot reach server. Please check your connection.';
    showError(friendly);
    btn.textContent = 'Reset Password'; btn.disabled = false;
  }
}
window.handleReset = handleReset;

function showError(msg) {
  if (!msg) return;
  let el = document.getElementById('auth-error');
  if (!el) {
    el = document.createElement('p'); el.id = 'auth-error';
    el.style.cssText = 'color:#f87171;font-size:0.85rem;text-align:center;margin-bottom:10px;';
    document.querySelector('.auth-submit').before(el);
  }
  el.style.display = 'block';
  el.textContent = msg;
  if (el._clearTimer) clearTimeout(el._clearTimer);
  el._clearTimer = setTimeout(() => {
    if (el && el.parentNode) { el.style.display = 'none'; el.textContent = ''; }
  }, 10000);
}
</script>
</body>
</html>
