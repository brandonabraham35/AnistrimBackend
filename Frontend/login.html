<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.gstatic.com; frame-src https://accounts.google.com;">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AniStrim</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-native.css">
  </head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo">
    <img src="img/logo.jpg" alt="AniStrim Logo" class="auth-logo-img">
    <h1>Ani<span>Strim</span></h1>
    <p>Sign in to continue</p>
  </div>

  <!-- Error message container -->
  <p id="auth-error" style="display:none;"></p>

  <button class="google-btn" id="google-login-btn">
    <!-- Google G icon -->
    <span id="google-btn-icon" style="width:26px;height:26px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 8px rgba(108,43,217,0.4);">
      <svg width="15" height="15" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
    </span>
    <span id="google-btn-text">Continue with Google</span>
  </button>

  <div class="divider"><span>OR</span></div>

  <div class="input-group">
    <label>Email</label>
    <input type="email" id="login-email" placeholder="you@example.com">
  </div>
  <div class="input-group">
    <label>Password</label>
    <div class="password-wrapper">
      <input type="password" id="login-pass" placeholder="••••••••">
      <button class="toggle-pw" onclick="togglePasswordVisibility('login-pass')">👁️</button>
    </div>
  </div>

  <button class="auth-submit" onclick="handleLogin()">Sign In</button>

  <div class="auth-links">
    <a href="forgot-password.html">Forgot password?</a><br>
    Need an account? <a href="signup.html">Sign up</a>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="shared/client-contract/session.js"></script>
<script src="config.js"></script>
<script src="scrpt.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script src="js/navigation.js"></script>
<script src="google-auth-handler.js"></script>
<script src="login.js"></script>
<script>
// ── Login Recovery Layer (runs before init code) ──────────
// Handles cold-start recovery, destination preservation, and stale
// auth cleanup so the user is never silently stuck on login.html.
(function () {
  if (typeof window.Capacitor === 'undefined' || !window.Capacitor.isNativePlatform?.()) return;

  var REDIRECT_KEY = '__loginRedirect';
  var PENDING_KEY = '__authPending';

  // ── Destination preservation ───────────────────────────
  // Capture redirect param early so it survives page reloads/kills.
  var redirectParam = new URLSearchParams(window.location.search).get('redirect');
  if (redirectParam) {
    try { sessionStorage.setItem(REDIRECT_KEY, redirectParam); } catch (e) {}
  } else {
    try { redirectParam = sessionStorage.getItem(REDIRECT_KEY); } catch (e) {}
  }

  // ── Stale auth attempt cleanup ─────────────────────────
  // If auth was in progress when the page was killed/reloaded, clear it.
  try {
    if (sessionStorage.getItem(PENDING_KEY)) {
      sessionStorage.removeItem(PENDING_KEY);
    }
  } catch (e) {}

  // ── Cold-start recovery ────────────────────────────────
  // If a valid session exists but we're still on login.html, the app
  // was likely killed after authentication but before navigation completed.
  var token = (window.Auth && window.Auth.token) ||
              localStorage.getItem('token') ||
              localStorage.getItem('anistrim.mobile.token') || '';
  if (token && window.State && window.State.isLoggedIn) {
    console.log('[LoginRecovery] Valid session on login page — recovering');
    try { sessionStorage.removeItem(REDIRECT_KEY); } catch (e) {}
    if (window.Navigation && window.Navigation.afterAuth) {
      window.Navigation.afterAuth(window.State.user, redirectParam);
    } else if (window.State.user) {
      window.location.replace(redirectParam || 'index.html');
    }
  }
})();

// Initialize the native Google Sign-In plugin when running inside Capacitor.
// This must happen before the user taps the Google login button so the
// Credential Manager API is ready. Uses the same web client ID as the backend.
// Integrates with window.__GoogleAuth state machine (defined in login.js).
(function () {
  // Capacitor exposes isNativePlatform() (a method) on the global; there is no
  // isNative boolean. The plugin proxy only registers with the bridge after
  // DOMContentLoaded on cold start, so we run on that event by default and
  // can be forced again on demand (window.__ensureGoogleSignInInit).
  function doInit() {
    if (window.__googleSignInInitInProgress) {
      // An init is already running (e.g. from the initial DOMContentLoaded
      // attempt or a lazy tap retry). Wait for it to settle for the caller.
      return window.__googleSignInInitInProgress;
    }
    if (window.__googleSignInInitialized) {
      if (window.__GoogleAuth) window.__GoogleAuth.setState(window.__GoogleAuth.STATES.READY);
      return Promise.resolve();
    }
    if (typeof window.Capacitor === 'undefined' || !window.Capacitor.isNativePlatform?.()) {
      console.log('[GoogleAuth][INIT] Not in native context — skipping native init');
      return Promise.resolve();
    }
    var googleSignIn = window.Capacitor.Plugins?.GoogleSignIn;
    if (!googleSignIn) {
      console.warn('[GoogleAuth][INIT] GoogleSignIn plugin NOT available — Capacitor.Plugins:', Object.keys(window.Capacitor.Plugins || {}));
      return Promise.resolve();
    }
    if (typeof googleSignIn.initialize !== 'function') {
      console.error('[GoogleAuth][INIT] GoogleSignIn.initialize is not a function');
      return Promise.resolve();
    }

    console.log('[GoogleAuth][INIT] Starting initialization');
    // Update state machine if available
    if (window.__GoogleAuth) window.__GoogleAuth.setState(window.__GoogleAuth.STATES.INITIALIZING);

    // Mark that initialization is in progress so login.js can check/watch it.
    var inProgress = (function () {
      var resolve;
      window.__googleSignInInitInProgress = new Promise(function (r) { resolve = r; });
      return resolve;
    })();

    // Fetch the Google Client ID from the backend (same as GIS uses).
    // Give the fetch a bounded timeout + retries so doInit always settles within
    // ~1 minute (free-tier Render can take up to a minute to wake from sleep).
    var backendUrl = (typeof window.getApiBaseUrl === 'function')
      ? window.getApiBaseUrl()
      : 'https://anistrimbackend.onrender.com';
    var clientIdRequest = function () {
      var url = backendUrl + '/api/auth/google/client-id';
      var opts = { headers: { 'Accept': 'application/json' } };
      if (typeof window.fetchWithRetry === 'function') {
        return window.fetchWithRetry(url, opts, { timeout: 20000, retries: 2 });
      }
      return fetch(url, opts);
    };
    clientIdRequest()
    .then(function(res) {
      console.log('[GoogleAuth][INIT] Client ID response status:', res.status);
      return res.json();
    })
    .then(function(data) {
      var clientId = (data && data.success === true && data.data) ? data.data.clientId : data.clientId;
      console.log('[GoogleAuth][INIT] Client ID configured:', clientId ? 'YES (length=' + clientId.length + ')' : 'NO');
      if (clientId) {
        return googleSignIn.initialize({ clientId: clientId }).then(function() {
          console.log('[GoogleAuth][INIT] Initialization successful');
          window.__googleSignInInitialized = true;
          if (window.__GoogleAuth) window.__GoogleAuth.setState(window.__GoogleAuth.STATES.READY);
        });
      } else {
        console.error('[GoogleAuth][INIT] Could not retrieve Google Client ID for native plugin');
      }
    })
    .catch(function(err) {
      console.error('[GoogleAuth][INIT] Failed:', err?.message || err);
    })
    .finally(function() {
      inProgress();
      window.__googleSignInInitInProgress = null;
    });
    return window.__googleSignInInitInProgress;
  }

  window.__ensureGoogleSignInInit = function () {
    if (typeof window.Capacitor === 'undefined' || !window.Capacitor.isNativePlatform?.()) {
      console.log('[GoogleAuth][INIT] Not in native context — skipping native init');
      return Promise.resolve();
    }
    return doInit();
  };

  // Default: initialize once the DOM and Capacitor bridge are ready.
  var start = () => doInit();
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
</body>
</html>
