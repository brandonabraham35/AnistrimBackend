<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.gstatic.com; frame-src https://accounts.google.com;">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | AniStrim</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-native.css">
  </head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo">
    <img src="img/logo.jpg" alt="AniStrim Logo" class="auth-logo-img">
    <h1>Create Account</h1>
    <p>Join AniStrim to start watching</p>
  </div>

  <!-- Error message container -->
  <p id="auth-error" style="display:none;"></p>

  <button class="google-btn" id="google-signup-btn">
    <span id="google-btn-icon" style="width:26px;height:26px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 8px rgba(108,43,217,0.4);">
      <svg width="15" height="15" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
    </span>
    <span id="google-btn-text">Continue with Google</span>
  </button>

  <div class="divider"><span>OR</span></div>

  <div class="input-group">
    <label>Full Name</label>
    <input type="text" id="signup-name" placeholder="Your name">
  </div>
  <div class="input-group">
    <label>Email</label>
    <input type="email" id="signup-email" placeholder="you@example.com">
  </div>
  <div class="input-group">
    <label>Password</label>
    <div class="password-wrapper">
      <input type="password" id="signup-pass" placeholder="••••••••">
      <button class="toggle-pw" onclick="togglePasswordVisibility('signup-pass')">👁️</button>
    </div>
  </div>

  <button class="auth-submit" onclick="handleSignUp()">Create Account</button>

  <div class="auth-links">
    Already have an account? <a href="login.html">Sign In</a>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client"></script>
<script src="shared/client-contract/session.js"></script>
<script src="config.js"></script>
<script src="scrpt.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script src="js/navigation.js"></script>
<script src="google-auth-handler.js"></script>
<script src="signup.js"></script>
<script>
// Initialize the native Google Sign-In plugin when running inside Capacitor.
(function() {
  if (typeof window.Capacitor !== 'undefined' && window.Capacitor.isNative) {
    var googleSignIn = window.Capacitor.Plugins?.GoogleSignIn;
    if (googleSignIn && typeof googleSignIn.initialize === 'function') {
      var backendUrl = (typeof window.getApiBaseUrl === 'function')
        ? window.getApiBaseUrl()
        : 'https://anistrimbackend.onrender.com';
      fetch(backendUrl + '/api/auth/google/client-id', {
        headers: { 'Accept': 'application/json' }
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var clientId = (data && data.success === true && data.data) ? data.data.clientId : data.clientId;
        if (clientId) {
          googleSignIn.initialize({ clientId: clientId });
          console.log('[GoogleAuth] Native Google Sign-In plugin initialized (signup)');
        } else {
          console.warn('[GoogleAuth] Could not retrieve Google Client ID for native plugin (signup)');
        }
      })
      .catch(function(err) {
        console.warn('[GoogleAuth] Failed to initialize native Google Sign-In plugin (signup):', err?.message || err);
      });
    }
  }
})();
</script>
</body>
</html>
