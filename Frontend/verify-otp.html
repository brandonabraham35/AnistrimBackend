<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email | AniStrim</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile-native.css">
</head>
<body class="auth-body">
<div class="auth-box">
  <div class="auth-logo">
    <div class="auth-logo-icon">A</div>
    <h1>Ani<span>Strim</span></h1>
    <p>Verify your email</p>
  </div>

  <!-- Error message container -->
  <p id="auth-error" style="display:none;"></p>

  <div id="otp-form">
    <p style="font-size:0.85rem;color:var(--text-dim);text-align:center;line-height:1.6;margin-bottom:16px;">
      We sent a 6-digit code to <strong id="otp-email" style="color:var(--purple);"></strong>.
      Enter it below to activate your account.
    </p>
    <div class="input-group" id="otp-code-group">
      <label>Verification Code</label>
      <input type="text" id="otp-code" inputmode="numeric" maxlength="6" placeholder="------"
             autocomplete="one-time-code"
             style="text-align:center;font-size:1.4rem;letter-spacing:8px;font-weight:700;">
    </div>
    <button class="auth-submit" id="otp-submit" onclick="handleVerifyOtp()">Verify & Continue</button>
    <div class="auth-links" style="text-align:center;">
      <button id="otp-resend" onclick="handleResendOtp()" style="background:none;border:none;color:var(--purple);cursor:pointer;font-size:0.85rem;text-decoration:underline;">
        Resend code
      </button>
      <span id="resend-timer" style="color:var(--text-dim);font-size:0.8rem;margin-left:4px;"></span>
      <br>
      <a href="login.html">← Back to Sign In</a>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="scrpt.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script src="js/navigation.js"></script>
<script>
// ── Load the pending email: ?email= is the source of truth, then
//    sessionStorage, then localStorage (mobile webview fallback). ──
const qs = new URLSearchParams(location.search);
const qsEmail = qs.get('email');
let pendingEmail = qsEmail || sessionStorage.getItem('pendingEmail') || localStorage.getItem('pendingEmail') || '';
if (pendingEmail) {
  sessionStorage.setItem('pendingEmail', pendingEmail);
  localStorage.setItem('pendingEmail', pendingEmail);
} else {
  // No email anywhere — nothing to verify. Back to login.
  window.location.href = 'login.html';
}

// Mask the email for display (e.g. j***@gmail.com).
function maskEmail(email) {
  if (!email) return '';
  const at = email.indexOf('@');
  if (at <= 1) return email;
  const local = email.slice(0, at);
  const first = local.charAt(0);
  const domain = email.slice(at);
  return first + '***' + domain;
}

const emailDisplay = document.getElementById('otp-email');
if (emailDisplay) emailDisplay.textContent = maskEmail(pendingEmail);

// Warn when the code could not be delivered (e.g. SMTP not configured).
const qsEmailSentOk = qs.get('emailSent') !== null ? qs.get('emailSent') === '1' : (sessionStorage.getItem('otpEmailSent') !== '0');
if (!qsEmailSentOk && emailDisplay && !document.getElementById('otp-delivery-note')) {
  const note = document.createElement('p');
  note.id = 'otp-delivery-note';
  note.style.cssText = 'color:#fbbf24;font-size:0.8rem;text-align:center;line-height:1.5;margin-top:8px;';
  note.textContent = 'We could not send the code to this email right now - tap "Resend code" to try again.';
  emailDisplay.parentNode?.insertBefore(note, emailDisplay.nextSibling);
}

// ── 6-digit input: auto-advance + paste support ─────────
const codeInput = document.getElementById('otp-code');
codeInput.addEventListener('input', () => {
  // Keep only digits (drop any pasted non-numeric chars).
  let v = codeInput.value.replace(/\D/g, '').slice(0, 6);
  codeInput.value = v;
  if (v.length === 6) {
    handleVerifyOtp();
  }
});

// ── Verify the OTP ───────────────────────────────────────────
async function handleVerifyOtp() {
  const code = codeInput.value.trim();
  const email = pendingEmail;
  const btn = document.getElementById('otp-submit');

  if (!code || code.length !== 6) { showError('Please enter the 6-digit code.'); return; }
  if (!email) { window.location.href = 'login.html'; return; }

  btn.textContent = 'Verifying...';
  btn.disabled = true;

  let data;
  try {
    const res = await window.apiFetch('/api/auth/verify-otp', {
      method: 'POST',
      body: JSON.stringify({ email, code })
    });
    data = res.data;
    if (res.ok !== false && data && data.token) {
      if (window.setAuthTokens) window.setAuthTokens(data.token, data.refreshToken);
      else localStorage.setItem('token', data.token);
      localStorage.setItem('isFirstVisit', 'true');
      // Redirect via the centralized helper (also cleans pendingEmail state).
      window.redirectAfterAuthentication(data.user, data.token, data.refreshToken);
      return;
    }
    if (!res.ok) {
      showError((data && data.message) || 'Verification failed. Please try again.');
      btn.textContent = 'Verify & Continue';
      btn.disabled = false;
      return;
    }
    showError((data && data.message) || 'Verification failed. Please try again.');
    btn.textContent = 'Verify & Continue';
    btn.disabled = false;
  } catch (e) {
    // Distinguish the common error types for a clear message (429 throws).
    const msg = (e && e.message) || '';
    let friendly = 'Verification failed. Please try again.';
    if (/too many/i.test(msg)) friendly = 'Too many attempts. Please tap "Resend code" to get a new code.';
    else if (/expired/i.test(msg)) friendly = 'This code has expired. Please tap "Resend code" for a new one.';
    else if (/invalid/i.test(msg)) friendly = 'That code is incorrect. Please check and try again.';
    else if (/connection|server/i.test(msg)) friendly = 'Cannot reach server. Please check your connection.';
    showError(friendly);
    btn.textContent = 'Verify & Continue';
    btn.disabled = false;
  }
}
window.handleVerifyOtp = handleVerifyOtp;

// ── Resend OTP with live cooldown timer ───────────────────────
const RESEND_COOLDOWN = 60; // seconds; matches backend RESEND_THROTTLE_SECONDS

function startResendCooldown(seconds) {
  const btn = document.getElementById('otp-resend');
  const timer = document.getElementById('resend-timer');
  let remaining = seconds;

  btn.disabled = true;
  timer.textContent = '(wait ' + remaining + 's)';

  const interval = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(interval);
      btn.disabled = false;
      timer.textContent = '';
    } else {
      timer.textContent = '(wait ' + remaining + 's)';
    }
  }, 1000);
}

async function handleResendOtp() {
  const email = pendingEmail;
  const btn = document.getElementById('otp-resend');

  if (!email) { window.location.href = 'login.html'; return; }

  btn.textContent = 'Sending...';
  btn.disabled = true;

  try {
    var resendRes = await window.apiFetch('/api/auth/resend-otp', {
      method: 'POST',
      body: JSON.stringify({ email })
    });
    // Only claim "code sent" when the backend confirms Mailgun accepted the email.
    if (resendRes && resendRes.ok && resendRes.data && resendRes.data.emailSent) {
      showError('A new code has been sent to your email.');
    } else {
      showError('We could not send a new code right now. Please wait and try again.');
    }
    startResendCooldown(RESEND_COOLDOWN);
  } catch (e) {
    const msg = (e && e.message) || '';
    if (/(wait|throttl)/i.test(msg)) {
      // Backend returned 429 — start cooldown from the reported retryAfter if present.
      const retryAfter = (e && e.data && e.data.retryAfter) ? e.data.retryAfter : RESEND_COOLDOWN;
      showError('Please wait before requesting another code.');
      startResendCooldown(retryAfter);
    } else {
      showError('Could not resend the code. Please wait and try again.');
      startResendCooldown(RESEND_COOLDOWN);
    }
  } finally {
    btn.textContent = 'Resend code';
    // Cooldown re-enables it via startResendCooldown; if not started, re-enable.
    if (!btn.disabled) btn.disabled = false;
  }
}
window.handleResendOtp = handleResendOtp;

// ── Error Display ───────────────────────────────────────────
function showError(msg) {
  if (!msg) return;
  let el = document.getElementById('auth-error');
  if (!el) {
    el = document.createElement('p');
    el.id = 'auth-error';
    el.style.cssText = 'color:#f87171;font-size:0.85rem;text-align:center;margin-bottom:10px;';
    document.querySelector('.auth-submit')?.before(el);
  }
  el.style.display = 'block';
  el.textContent = msg;
  if (el._clearTimer) clearTimeout(el._clearTimer);
  el._clearTimer = setTimeout(() => {
    if (el && el.parentNode) {
      el.style.display = 'none';
      el.textContent = '';
    }
  }, 10000);
}
window.showError = showError;

// ── Enter key submits the code ──────────────────────────────
codeInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleVerifyOtp();
});
</script>
</body>
</html>
