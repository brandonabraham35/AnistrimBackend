<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authenticating...</title>
    <style>
        body { background: #080a10; font-family: sans-serif; color: #a0aec0; display: grid; place-items: center; min-height: 100vh; }
        .container { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Authenticating...</h2>
        <p>Please wait while we securely log you in.</p>
    </div>
    <script>
        (function() {
            try {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token');
                const error = params.get('error');

                if (error) {
                    const message = error === 'not_admin' ? 'Access Denied. This Google account is not an administrator.' : 'An unknown authentication error occurred.';
                    window.location.replace(`index.html?error=${encodeURIComponent(message)}`);
                } else if (token) {
                    localStorage.setItem('admin_token', token);
                    window.location.replace('dashboard.html');
                } else {
                    window.location.replace(`index.html?error=${encodeURIComponent('Invalid authentication callback.')}`);
                }
            } catch (e) {
                console.error('Auth callback error:', e);
                window.location.replace(`index.html?error=${encodeURIComponent('A client-side error occurred during login.')}`);
            }
        })();
    </script>
</body>
</html>
