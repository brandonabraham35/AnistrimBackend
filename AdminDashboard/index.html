<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>AniStrim Admin - Login</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Optional: Using Font Awesome for icons. You can replace with your own SVGs. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- Logo and Branding -->
        <div class="login-header">
            <!-- Ensure your game/admin logo is at 'img/logo.png' or update the path -->
            <img src="img/logo.jpg" alt="AniStrim Logo" class="logo">
            <h1>AniStrim Admin Portal</h1>
            <p>Secure Access to Your Streaming Empire.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <i class="fa fa-envelope input-icon"></i>
                <input type="email" id="email" required placeholder="admin@anistrim.com">
            </div>
            <div class="form-group">
                <i class="fa fa-lock input-icon"></i>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <a href="#" class="forgot-password">Forgot Password?</a>
            
            <button type="submit" id="login-btn">Log In</button>
            <p id="error-message" class="error"></p>

            <div class="divider">OR</div>

            <button type="button" class="google-btn" id="admin-google-btn" onclick="window.googleLogin()">
                <!-- Google Icon SVG (wrapped so the shared auth module can swap it for a spinner) -->
                <span id="admin-google-btn-icon" style="display:inline-flex;align-items:center;justify-content:center;">
                    <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path d="M17.64 9.20455C17.64 8.56636 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5614V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z" fill="#4285F4"/><path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5614C11.2418 14.1014 10.2109 14.4205 9 14.4205C6.65591 14.4205 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9832 5.48182 18 9 18Z" fill="#34A853"/><path d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29H0.957275C0.347727 8.55 0 10.17 0 12C0 13.83 0.347727 15.45 0.957275 16.71L3.96409 14.29V10.71Z" fill="#FBBC05"/><path d="M9 3.57955C10.3214 3.57955 11.5077 4.02409 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.43 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z" fill="#EA4335"/></svg>
                </span>
                <span id="admin-google-btn-text">Sign in with Google</span>
            </button>
        </form>
    </div>

    <footer class="login-footer">
        AniStrim Platform © 2024
    </footer>

    <!-- Google Identity Services library (required for Sign in with Google button) -->
    <script src="https://accounts.google.com/gsi/client"></script>
    <!-- JS files must be loaded in the correct order -->
    <!-- Shared backend-URL helper — must load BEFORE api.js / google-auth-handler.js / auth.js -->
    <script src="/shared/client-contract/session.js"></script>
    <script src="js/backend-url.js"></script>
    <script src="js/api.js"></script>
    <!-- Shared Google Auth Module (served from Frontend at root path) -->
    <script src="/google-auth-handler.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
