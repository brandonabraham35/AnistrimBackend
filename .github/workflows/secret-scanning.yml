name: Secret Scanning

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required to upload the SARIF report

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (working tree)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # optional
          GITLEAKS_CONFIG: .gitleaks.toml

  # GitHub native secret scanning (free, no license required) — recommended.
  # Enable in: Settings -> Code security and analysis -> Secret scanning.
  # This job is a lightweight guard; the native scanner is the primary control.
  native-scan-notice:
    name: Enable GitHub native secret scanning
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Enable native secret scanning in the repo settings:"
          echo "  Settings -> Code security and analysis -> Secret scanning (push protection)."
          echo "Also add a Secret Scanning bypass/allow-list for .env.example if desired."
