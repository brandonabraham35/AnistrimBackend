<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniStrim — Stream Anime Online</title>
  <meta name="description" content="AniStrim — browse and stream anime online. Trending, popular, latest, and your personal watchlist.">
  <meta name="anistrim-api" content="">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <header class="site-header" id="site-header"></header>
    <main class="site-main" id="site-main"></main>
    <footer class="site-footer" id="site-footer"></footer>
  </div>
  <div id="toast-root" class="toast-root"></div>

  <!-- B13 (audit) fix: bundle hls.js locally (no remote CDN) so the player
       works offline and satisfies the Desktop/Electron CSP (script-src 'self').
       The same local copy is referenced by Desktop/vendor/hls.min.js. -->
  <script src="js/vendor/hls.min.js"></script>

  <!-- Bundled copy: Web is independently deployable and does not rely on
       backend static-file middleware for its scoped session contract. -->
  <script src="js/vendor/shared/session.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/router.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
